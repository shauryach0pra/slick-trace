# Reference release is CPU-only (see Dockerfile header for why torch/GPU
# isn't part of this image). Quick start:
#
#   docker compose --profile cpu up
#
# Then open http://localhost:8000 — no internet access required after the
# image is built; the app makes no outbound calls. To verify this, run the
# offline check below (disconnect networking, rerun, confirm it still works):
#
#   docker compose --profile cpu up -d
#   docker network disconnect slick-trace_default slick-trace-slicktrace-1
#   docker exec slick-trace-slicktrace-1 python3 scripts/smoke_test.py
#
# Run the check INSIDE the container: disconnecting the network also removes
# the host port forward, so localhost:8000 is unreachable from the host while
# the container is offline. Reconnect afterwards with:
#   docker network connect slick-trace_default slick-trace-slicktrace-1
#
# (Re-attach the network afterwards if you want to keep using docker compose commands against it.)

services:
  slicktrace:
    build:
      context: .
      dockerfile: Dockerfile
    image: slicktrace:cpu
    profiles: ["cpu"]
    ports:
      - "8000:8000"
    volumes:
      - slicktrace-data:/app/data   # named volume so incident data survives container restarts
    restart: unless-stopped

volumes:
  slicktrace-data:
