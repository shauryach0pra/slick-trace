name: tests

# Reproducibility is a claim this repository makes in several places. Running
# the suite on a clean machine on every push is what turns that from an
# assertion into something a reader can check the result of.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install from the lock, not requirements.txt: the lock pins every direct
      # and transitive dependency, so CI runs the environment the results were
      # produced under rather than whatever resolves today.
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock -r requirements-dev.lock

      # Torch is deliberately absent from requirements.lock: the runtime image
      # runs the classical detector and does not need a deep learning
      # framework. It is installed here anyway, because the two tests that
      # actually load the shipped checkpoint skip without it - and a checkpoint
      # that fails to load is precisely the failure a clone would hit first.
      # CPU-only wheel: no CUDA, much smaller download.
      # rasterio is optional for the same reason as torch: it pulls GDAL
      # (>100 MB) and the shipped runtime reads PNG. Installed here so the
      # GeoTIFF adapter tests run rather than skip - an adapter nobody
      # exercises is an adapter nobody has checked.
      - name: Install rasterio so GeoTIFF adapter tests do not skip
        run: pip install rasterio

      - name: Install torch (CPU) so checkpoint tests do not skip
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run test suite
        run: python -m pytest tests/ -q

      # Determinism, scoped to what the claim actually covers.
      #
      # Every analysis artifact - attribution, fragility, hindcast, coverage,
      # forecast, next-observation, detection - regenerates byte-identically on
      # a different OS and architecture, and that is what the reproducibility
      # claim rests on.
      #
      # Three categories are excluded, with reasons rather than silently:
      #   *.png   PNG encoding depends on the zlib build, so identical pixels
      #           serialise to a different byte stream on Ubuntu than on macOS.
      #   *.npz   A .npz is a zip archive and stores member timestamps.
      #   manifest.json, investigation_report.*
      #           These carry SHA-256 checksums OF the files above, so they
      #           differ for exactly the reason those do.
      #
      # naive_baseline_result.json is NOT excluded: it differs at the last
      # floating-point digit of distance_deg between x86-64 and arm64, which is
      # a genuine platform difference and should fail loudly if it ever grows.
      - name: Verify analysis artifacts regenerate byte-identically
        run: |
          python scripts/run_pipeline.py --regenerate
          git diff --exit-code --stat -- \
            'data/cases/*/attribution_result.json' \
            'data/cases/*/fragility_result.json' \
            'data/cases/*/historical_mapping.json' \
            'data/cases/*/coverage_result.json' \
            'data/cases/*/forecast_result.json' \
            'data/cases/*/next_observation_result.json' \
            'data/cases/*/detection_result.json' \
            || (echo "::error::Analysis artifacts differ after regeneration" && exit 1)
          echo "Analysis artifacts byte-identical across platforms."

      - name: Re-score and verify headline results hold
        run: |
          python scripts/run_validation.py
          python - <<'EOF'
          import json
          d = json.load(open("docs/validation_report.json"))
          sp = d["attribution"]["source_present"]
          sa = d["attribution"]["source_absent"]
          assert sp["method_top1"] == sp["n"], f"forward replay {sp['method_top1']}/{sp['n']}"
          assert sp["naive_top1"] == 0, f"naive baseline scored {sp['naive_top1']}"
          assert sa["false_named_attributions"] == 0, "named a source on an absent-source case"
          assert sp["mcnemar"]["p_value"] < 0.05, f"p = {sp['mcnemar']['p_value']}"
          print(f"ok: {sp['method_top1']}/{sp['n']} vs {sp['naive_top1']}/{sp['n']}, "
                f"p = {sp['mcnemar']['p_value']}")
          EOF
